packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true

# 本机（Windows）绕行：pnpm 默认 isolated 链接方式在本机创建符号链接会失败，
# 生成空占位目录导致依赖解析不到，故改用 hoisted 扁平布局。详见 AGENTS.md。
nodeLinker: hoisted

# store 放工程内（本机全局缓存目录在只读盘上）。.pnpm-store 已 gitignore。
storeDir: C:\Users\Zefra\Desktop\snap2sku\.pnpm-store
