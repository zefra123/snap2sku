<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 260" fill="none" role="img" aria-label="hero 背景装饰：取景框、衣架、吊牌与条码">
  <!-- 取景框：极淡整框 + 四角括弧。全图无任何底色块，底色由页面自身提供 -->
  <rect x="836" y="36" width="196" height="192" rx="20" stroke="#36508C" stroke-opacity=".10" stroke-width="1.2"/>
  <g stroke="#36508C" stroke-opacity=".50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M836 84V58a22 22 0 0 1 22-22h26"/>
    <path d="M1032 84V58a22 22 0 0 0-22-22h-26"/>
    <path d="M836 180v26a22 22 0 0 0 22 22h26"/>
    <path d="M1032 180v26a22 22 0 0 1-22 22h-26"/>
  </g>

  <!-- 衣架 + 衣物：纯线稿，只留 6% 靛蓝罩色，不铺实色 -->
  <g stroke="#36508C" stroke-linecap="round" stroke-linejoin="round">
    <path d="M934 88l-2-12a8.5 8.5 0 1 1 7 0" stroke-opacity=".62" stroke-width="2.4"/>
    <path d="M934 88l-43 21h86z" stroke-opacity=".62" stroke-width="2.4"/>
    <path d="M906 116 L890 125 L882 148 L899 155 L899 184 L969 184 L969 155 L986 148 L978 125 L962 116 Q934 128 906 116 Z"
          fill="#36508C" fill-opacity=".06" stroke-opacity=".55" stroke-width="2.2"/>
  </g>

  <!-- 扫描线：赭石，AI 识别意象 -->
  <g stroke="#B26A3A" stroke-linecap="round">
    <path d="M848 148H1020" stroke-opacity=".70" stroke-width="2.4"/>
    <path d="M848 141v13" stroke-opacity=".45" stroke-width="2"/>
    <path d="M1020 141v13" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <!-- 识别标记点 + 引线 -->
  <g fill="#36508C" fill-opacity=".50">
    <circle cx="912" cy="138" r="2.2"/>
    <circle cx="934" cy="131" r="2.2"/>
    <circle cx="956" cy="138" r="2.2"/>
  </g>
  <path d="M956 138l38-17" stroke="#36508C" stroke-opacity=".28" stroke-width="1.4" stroke-dasharray="3 4" stroke-linecap="round"/>

  <!-- 吊牌：挂绳 + 线框，无实底 -->
  <path d="M1118 42q10 32-2 58" stroke="#B26A3A" stroke-opacity=".50" stroke-width="1.6" stroke-linecap="round"/>
  <g>
    <rect x="1078" y="100" width="76" height="98" rx="10" stroke="#36508C" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="1116" cy="115" r="4" stroke="#36508C" stroke-opacity=".45" stroke-width="2"/>
    <rect x="1094" y="130" width="44" height="6" rx="3" fill="#36508C" fill-opacity=".15"/>
    <rect x="1094" y="146" width="28" height="6" rx="3" fill="#B26A3A" fill-opacity=".22"/>
    <rect x="1094" y="162" width="36" height="6" rx="3" fill="#36508C" fill-opacity=".10"/>
  </g>

  <!-- 条码：极细墨线，仅作质感 -->
  <g stroke="#332F28" stroke-opacity=".18">
    <path d="M706 240V198" stroke-width="3"/>
    <path d="M716 240V198" stroke-width="1.4"/>
    <path d="M724 240V198" stroke-width="3.6"/>
    <path d="M735 240V198" stroke-width="1.4"/>
    <path d="M742 240V198" stroke-width="2.8"/>
    <path d="M752 240V198" stroke-width="1.4"/>
    <path d="M760 240V198" stroke-width="3.6"/>
    <path d="M771 240V198" stroke-width="2.8"/>
    <path d="M780 240V198" stroke-width="1.4"/>
    <path d="M788 240V198" stroke-width="3"/>
  </g>

  <!-- 星芒点缀 -->
  <path d="M1052 44l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#B26A3A" fill-opacity=".60"/>
  <path d="M716 54l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#36508C" fill-opacity=".40"/>
  <path d="M1186 160l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#B26A3A" fill-opacity=".50"/>
</svg>
