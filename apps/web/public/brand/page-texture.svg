<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- 可平铺的极淡纸张颗粒底纹：暖褐色噪点，alpha 由噪声亮度驱动 -->
  <filter id="pt-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.24
              0 0 0 0 0.20
              0 0 0 0 0.15
              0.07 0.07 0.07 0 0"/>
  </filter>
  <rect width="300" height="300" filter="url(#pt-grain)"/>
</svg>
